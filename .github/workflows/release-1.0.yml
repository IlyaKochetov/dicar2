name: Publish 1.0 release

on:
  push:
    tags: ['1.0']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk DiCar-International-1.0.apk
          sha256sum DiCar-International-1.0.apk > DiCar-International-1.0.apk.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 1.0 DiCar-International-1.0.apk DiCar-International-1.0.apk.sha256 \
            --title "DiCar International 1.0" --notes-file CHANGELOG.md --latest
